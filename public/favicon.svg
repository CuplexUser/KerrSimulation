<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Kerr black hole">
  <title>Kerr</title>
  <defs>
    <!--
      Left-to-right hot-to-cool ramp stands in for Doppler beaming: the
      approaching limb runs white-hot, the receding limb falls back to ember.
      Same three stops the renderer uses for the disk.
    -->
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff8ec" />
      <stop offset="0.42" stop-color="#ffc46b" />
      <stop offset="1" stop-color="#a8480f" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="#18181c" />

  <!-- Accretion disk, seen near edge-on. -->
  <ellipse cx="16" cy="17.6" rx="13" ry="4.1" fill="url(#disk)" />

  <!-- The far side of the disk, lensed up and over the shadow. -->
  <path
    d="M3.5 17.6 A 12.5 12.5 0 0 1 28.5 17.6"
    fill="none"
    stroke="url(#disk)"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- The shadow itself. -->
  <circle cx="16" cy="16.5" r="6.5" fill="#0a0a0c" />
</svg>
